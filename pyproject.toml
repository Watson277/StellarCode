[project]
name = "stellarcode"
version = "0.1.0"
description = "StellarCode: a Python coding agent with tools, planning, memory, RAG, MCP, and multimodal input."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "httpx>=0.27,<1.0",
    "jieba>=0.42,<1.0",
    "markdownify>=0.13,<2.0",
    "mcp>=1.0,<2.0",
    "pillow>=10.0,<13.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.7,<14.0",
    "uapi-sdk-python>=0.1,<1.0",
]

[project.scripts]
stellarcode = "stellarcode.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
stellarcode = ["skills/**/*.md"]
